<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AABF Feni - Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-container">

        <!-- Logo -->
        <div class="logo-box">
            <div class="blood-drop">♥</div>
        </div>

        <!-- Heading -->
        <h1>AABF Feni</h1>
        <p class="subtitle">Create your account</p>

        <!-- Form -->
        <form id="signupForm">

            <div class="input-box">
                <span>👤</span>
                <input
                    type="text"
                    id="name"
                    placeholder="আপনার নাম"
                    required
                >
            </div>

            <div class="input-box">
                <span>📱</span>
                <input
                    type="tel"
                    id="phone"
                    placeholder="মোবাইল নম্বর"
                    maxlength="11"
                    required
                >
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
                <button type="button" class="eye" onclick="togglePassword('password', this)">
                    👁
                </button>
            </div>

            <div class="input-box">
                <span>🔐</span>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >
                <button type="button" class="eye" onclick="togglePassword('confirmPassword', this)">
                    👁
                </button>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <!-- Login -->
        <p class="login-text">
            Already have an account?
            <span onclick="login()">Login</span>
        </p>

    </div>

   <script type="module" src="script.js"></script>

</body>
</html>
