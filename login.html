<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AABF Feni - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: linear-gradient(145deg, #fff5f5, #ffffff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 390px;
            text-align: center;
        }

        .logo-box {
            width: 82px;
            height: 82px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #d90429;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.22);
        }

        .blood-drop {
            color: white;
            font-size: 38px;
        }

        h1 {
            font-size: 28px;
            color: #b00020;

            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;

            margin-bottom: 28px;
        }

        .input-box {
            height: 56px;
            width: 100%;

            background: white;

            border: 1px solid #e6e6e6;

            border-radius: 15px;

            margin-bottom: 14px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
        }

        .input-box span {
            font-size: 19px;
            margin-right: 12px;
        }

        .input-box input {
            flex: 1;

            height: 100%;

            border: none;
            outline: none;

            font-size: 15px;

            background: transparent;

            color: #222;
        }

        .eye {
            border: none;

            background: transparent;

            font-size: 17px;

            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 56px;

            margin-top: 8px;

            border: none;

            border-radius: 15px;

            background: #d90429;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.7;
        }

        .register-text {
            margin-top: 22px;

            font-size: 14px;

            color: #777;
        }

        .register-text span {
            color: #d90429;

            font-weight: bold;

            cursor: pointer;
        }

        @media (max-width: 360px) {

            body {
                padding: 15px;
            }

            .logo-box {
                width: 72px;
                height: 72px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>


<body>

    <div class="login-container">

        <div class="logo-box">
            <div class="blood-drop">♥</div>
        </div>

        <h1>AABF Feni</h1>

        <p class="subtitle">
            Login to your account
        </p>


        <form id="loginForm">

            <!-- Mobile Number -->

            <div class="input-box">

                <span>📱</span>

                <input
                    type="tel"
                    id="phone"
                    placeholder="মোবাইল নম্বর"
                    maxlength="11"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="eye"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <span onclick="goToRegister()">
                Create Account
            </span>

        </p>

    </div>


<script type="module">


/* =========================================
   FIREBASE IMPORT
========================================= */


import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* =========================================
   FIREBASE CONFIGURATION
========================================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyAR3uyMlvGNwZaG_w1zs6IKQ2lXB_Y_9M0",

    authDomain:
    "al-awn-blood-fighters.firebaseapp.com",

    projectId:
    "al-awn-blood-fighters",

    storageBucket:
    "al-awn-blood-fighters.firebasestorage.app",

    messagingSenderId:
    "299061496611",

    appId:
    "1:299061496611:web:4762f74dbf311cd57f1a96",

    measurementId:
    "G-D31EXKJWQ3"
};



/* =========================================
   INITIALIZE FIREBASE
========================================= */


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);



/* =========================================
   PASSWORD SHOW / HIDE
========================================= */


window.togglePassword = function () {

    const password =
    document.getElementById("password");


    const button =
    document.querySelector(".eye");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    }

    else {

        password.type = "password";

        button.textContent = "👁";

    }

};



/* =========================================
   SEND LOGIN RESULT TO KODULAR
========================================= */


function sendLoginSuccess(uid) {

    const message =
    "LOGIN_SUCCESS:" + uid;


    console.log(message);


    /*
       Kodular WebViewer-এর জন্য
       WebView String পাঠানো হচ্ছে
    */


    if (
        window.AppInventor &&
        typeof window.AppInventor.setWebViewString === "function"
    ) {

        window.AppInventor.setWebViewString(message);

    }

    else {

        /*
           Browser-এ খুললে শুধু console-এ দেখাবে
        */

        console.log(
            "Kodular WebView interface পাওয়া যায়নি।"
        );

    }

}



/* =========================================
   LOGIN
========================================= */


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const phone =
        document
        .getElementById("phone")
        .value
        .trim();


        const password =
        document
        .getElementById("password")
        .value;



        /* =================================
           PHONE VALIDATION
        ================================= */


        const phonePattern =
        /^01[3-9]\d{8}$/;


        if (!phonePattern.test(phone)) {

            alert(
                "সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।"
            );

            return;
        }



        /* =================================
           PASSWORD VALIDATION
        ================================= */


        if (password.length < 6) {

            alert(
                "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
            );

            return;
        }



        /* =================================
           LOGIN BUTTON
        ================================= */


        const loginButton =
        document
        .getElementById("loginButton");


        loginButton.disabled = true;

        loginButton.textContent =
        "Logging in...";



        try {


            /* =============================
               PHONE → INTERNAL EMAIL
            ============================= */


            const internalEmail =
            phone + "@aabf-user.app";



            /* =============================
               FIREBASE LOGIN
            ============================= */


            const userCredential =
            await signInWithEmailAndPassword(
                auth,
                internalEmail,
                password
            );


            const user =
            userCredential.user;


            const uid =
            user.uid;



            console.log(
                "Login successful:",
                uid
            );



            /* =============================
               LOGIN SUCCESS MESSAGE
            ============================= */


            alert(
                "✅ Login সফল হয়েছে!"
            );


            /*
               এখান থেকে আর
               aabf:// URL ব্যবহার করা হচ্ছে না।

               সরাসরি Kodular WebView String-এ
               UID পাঠানো হচ্ছে।
            */


            sendLoginSuccess(uid);



            loginButton.disabled = false;

            loginButton.textContent =
            "Login";


        }


        catch (error) {


            console.error(error);


            let message =
            "Login করা যায়নি।";



            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                "মোবাইল নম্বর অথবা Password ভুল।";

            }


            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                "এই নম্বর দিয়ে কোনো Account পাওয়া যায়নি।";

            }


            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                "Password ভুল।";

            }


            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                "Internet connection পরীক্ষা করুন।";

            }


            alert(message);


            loginButton.disabled = false;

            loginButton.textContent =
            "Login";

        }

    }
);



/* =========================================
   GO TO REGISTER
========================================= */


window.goToRegister = function () {

    window.location.href =
    "index.html";

};


</script>

</body>
</html>
