<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AABF Team - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                "Noto Sans Bengali",
                sans-serif;

            background:
                linear-gradient(
                    145deg,
                    #fff5f5,
                    #ffffff
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .login-container {

            width: 100%;

            max-width: 390px;

            text-align: center;
        }


        .logo-box {

            width: 82px;

            height: 82px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            background: #d90429;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 10px 25px
                rgba(217, 4, 41, 0.22);
        }


        .blood-drop {

            color: white;

            font-size: 38px;
        }


        h1 {

            font-size: 28px;

            color: #b00020;

            margin-bottom: 5px;
        }


        .subtitle {

            color: #777;

            font-size: 15px;

            margin-bottom: 28px;
        }


        .input-box {

            height: 56px;

            width: 100%;

            background: white;

            border:
                1px solid #e6e6e6;

            border-radius: 15px;

            margin-bottom: 14px;

            display: flex;

            align-items: center;

            padding: 0 16px;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.04);
        }


        .input-box span {

            font-size: 19px;

            margin-right: 12px;
        }


        .input-box input {

            flex: 1;

            height: 100%;

            border: none;

            outline: none;

            font-size: 15px;

            background: transparent;

            color: #222;
        }


        .eye {

            border: none;

            background: transparent;

            font-size: 17px;

            cursor: pointer;
        }


        .login-btn {

            width: 100%;

            height: 56px;

            margin-top: 8px;

            border: none;

            border-radius: 15px;

            background: #d90429;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(217, 4, 41, 0.25);
        }


        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }


        .register-text {

            margin-top: 22px;

            font-size: 14px;

            color: #777;
        }


        .register-text span {

            color: #d90429;

            font-weight: bold;

            cursor: pointer;
        }


        @media (max-width: 360px) {

            body {

                padding: 15px;
            }


            .logo-box {

                width: 72px;

                height: 72px;
            }


            h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo-box">

            <div class="blood-drop">
                ♥
            </div>

        </div>


        <!-- TITLE -->

        <h1>
            AABF Feni
        </h1>


        <p class="subtitle">
            Login to your account
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- PHONE -->

            <div class="input-box">

                <span>
                    📱
                </span>


                <input

                    type="tel"

                    id="phone"

                    placeholder="মোবাইল নম্বর"

                    maxlength="11"

                    inputmode="numeric"

                    autocomplete="tel"

                    required

                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <span>
                    🔒
                </span>


                <input

                    type="password"

                    id="password"

                    placeholder="Password"

                    autocomplete="current-password"

                    required

                >


                <button

                    type="button"

                    class="eye"

                    id="eyeButton"

                    onclick="togglePassword()"

                >
                    👁
                </button>

            </div>


            <!-- LOGIN BUTTON -->

            <button

                type="submit"

                class="login-btn"

                id="loginButton"

            >
                Login
            </button>


        </form>


        <!-- REGISTER -->

        <p class="register-text">

            Don't have an account?

            <span onclick="goToRegister()">

                Create Account

            </span>

        </p>


    </div>



    <!-- =====================================
         FIREBASE
    ====================================== -->

    <script type="module">


        import {

            initializeApp

        }

        from

        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



        import {

            getAuth,

            signInWithEmailAndPassword

        }

        from

        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



        // =====================================
        // FIREBASE CONFIGURATION
        // =====================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyAR3uyMlvGNwZaG_w1zs6IKQ2lXB_Y_9M0",

            authDomain:
                "al-awn-blood-fighters.firebaseapp.com",

            projectId:
                "al-awn-blood-fighters",

            storageBucket:
                "al-awn-blood-fighters.firebasestorage.app",

            messagingSenderId:
                "299061496611",

            appId:
                "1:299061496611:web:4762f74dbf311cd57f1a96",

            measurementId:
                "G-D31EXKJWQ3"

        };



        // =====================================
        // INITIALIZE FIREBASE
        // =====================================

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);



        // =====================================
        // PASSWORD SHOW / HIDE
        // =====================================

        window.togglePassword =
        function () {


            const password =
                document.getElementById(
                    "password"
                );


            const button =
                document.getElementById(
                    "eyeButton"
                );


            if (
                password.type ===
                "password"
            ) {


                password.type =
                    "text";


                button.textContent =
                    "🙈";


            }

            else {


                password.type =
                    "password";


                button.textContent =
                    "👁";

            }

        };



        // =====================================
        // SEND LOGIN SUCCESS TO KODULAR
        // =====================================

        function sendLoginSuccess(uid) {


            const message =
                "LOGIN_SUCCESS:" + uid;


            console.log(
                "Sending to Kodular:",
                message
            );


            /*
             * IMPORTANT:
             *
             * Kodular WebViewer-এর
             * Web View String Change event
             * এই command-এর মাধ্যমে trigger হবে।
             */

            if (
                window.Kodular &&
                typeof
                window.Kodular.setWebViewString ===
                "function"
            ) {


                window.Kodular.setWebViewString(
                    message
                );


            }

            else {


                console.error(
                    "Kodular WebView interface পাওয়া যায়নি।"
                );


                alert(
                    "Kodular WebView interface পাওয়া যায়নি।"
                );

            }

        }



        // =====================================
        // LOGIN FORM
        // =====================================

        document

        .getElementById(
            "loginForm"
        )

        .addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();



                // =====================================
                // GET PHONE
                // =====================================

                const phone =
                    document

                    .getElementById(
                        "phone"
                    )

                    .value

                    .trim();



                // =====================================
                // GET PASSWORD
                // =====================================

                const password =
                    document

                    .getElementById(
                        "password"
                    )

                    .value;



                // =====================================
                // PHONE VALIDATION
                // =====================================

                const phonePattern =
                    /^01[3-9]\d{8}$/;



                if (
                    !phonePattern.test(
                        phone
                    )
                ) {


                    alert(
                        "সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।"
                    );


                    return;

                }



                // =====================================
                // PASSWORD VALIDATION
                // =====================================

                if (
                    password.length < 6
                ) {


                    alert(
                        "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
                    );


                    return;

                }



                // =====================================
                // LOGIN BUTTON
                // =====================================

                const loginButton =
                    document

                    .getElementById(
                        "loginButton"
                    );


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Logging in...";



                try {


                    // =====================================
                    // PHONE → INTERNAL EMAIL
                    // =====================================

                    const internalEmail =
                        phone +
                        "@aabf-user.app";


                    console.log(
                        "Internal Email:",
                        internalEmail
                    );



                    // =====================================
                    // FIREBASE LOGIN
                    // =====================================

                    const userCredential =

                        await
                        signInWithEmailAndPassword(

                            auth,

                            internalEmail,

                            password

                        );



                    // =====================================
                    // GET USER
                    // =====================================

                    const user =
                        userCredential.user;



                    // =====================================
                    // GET UID
                    // =====================================

                    const uid =
                        user.uid;



                    console.log(
                        "Firebase Login Successful"
                    );


                    console.log(
                        "UID:",
                        uid
                    );



                    // =====================================
                    // SEND UID TO KODULAR
                    // =====================================

                    sendLoginSuccess(
                        uid
                    );



                    /*
                     * এখানে কোনো
                     * aabf:// URL নেই।
                     *
                     * কোনো location.href নেই।
                     *
                     * কোনো location.hash নেই।
                     *
                     * কোনো success alert নেই।
                     *
                     * Kodular-কে সরাসরি String পাঠানো হচ্ছে।
                     */



                }


                catch (error) {


                    console.error(
                        "Firebase Login Error:",
                        error
                    );



                    let message =
                        "Login করা যায়নি।";



                    // =====================================
                    // ERROR: INVALID CREDENTIAL
                    // =====================================

                    if (

                        error.code ===
                        "auth/invalid-credential"

                    ) {

                        message =
                            "মোবাইল নম্বর অথবা Password ভুল।";

                    }



                    // =====================================
                    // ERROR: USER NOT FOUND
                    // =====================================

                    else if (

                        error.code ===
                        "auth/user-not-found"

                    ) {

                        message =
                            "এই নম্বর দিয়ে কোনো Account পাওয়া যায়নি।";

                    }



                    // =====================================
                    // ERROR: WRONG PASSWORD
                    // =====================================

                    else if (

                        error.code ===
                        "auth/wrong-password"

                    ) {

                        message =
                            "Password ভুল।";

                    }



                    // =====================================
                    // ERROR: INVALID EMAIL
                    // =====================================

                    else if (

                        error.code ===
                        "auth/invalid-email"

                    ) {

                        message =
                            "মোবাইল নম্বর সঠিক নয়।";

                    }



                    // =====================================
                    // ERROR: NETWORK
                    // =====================================

                    else if (

                        error.code ===
                        "auth/network-request-failed"

                    ) {

                        message =
                            "Internet connection পরীক্ষা করুন।";

                    }



                    // =====================================
                    // ERROR: TOO MANY REQUESTS
                    // =====================================

                    else if (

                        error.code ===
                        "auth/too-many-requests"

                    ) {

                        message =
                            "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

                    }



                    // =====================================
                    // SHOW ERROR
                    // =====================================

                    alert(
                        message
                    );



                    // =====================================
                    // RESET LOGIN BUTTON
                    // =====================================

                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "Login";

                }

            }

        );



        // =====================================
        // GO TO REGISTER
        // =====================================

        window.goToRegister =
        function () {


            window.location.href =
                "index.html";

        };


    </script>


</body>

</html>
