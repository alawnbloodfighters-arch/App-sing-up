<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AABF Feni - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: linear-gradient(145deg, #fff5f5, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 390px;
            text-align: center;
        }

        .logo-box {
            width: 82px;
            height: 82px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #d90429;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.22);
        }

        .blood-drop {
            color: white;
            font-size: 38px;
        }

        h1 {
            font-size: 28px;
            color: #b00020;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .input-box {
            height: 56px;
            width: 100%;
            background: white;
            border: 1px solid #e6e6e6;
            border-radius: 15px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
        }

        .input-box span {
            font-size: 19px;
            margin-right: 12px;
        }

        .input-box input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: #222;
        }

        .eye {
            border: none;
            background: transparent;
            font-size: 17px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            margin-top: 8px;
            border: none;
            border-radius: 15px;
            background: #d90429;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.7;
        }

        .register-text {
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .register-text span {
            color: #d90429;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 360px) {
            body {
                padding: 15px;
            }

            .logo-box {
                width: 72px;
                height: 72px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo-box">
            <div class="blood-drop">♥</div>
        </div>

        <h1>AABF Feni</h1>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm">

            <div class="input-box">
                <span>📱</span>
                <input
                    type="tel"
                    id="phone"
                    placeholder="মোবাইল নম্বর"
                    maxlength="11"
                    required
                >
            </div>

            <div class="input-box">
                <span>🔒</span>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="eye"
                    onclick="togglePassword()"
                >👁</button>
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <span onclick="goToRegister()">Create Account</span>
        </p>

    </div>


    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // =========================
        // Firebase Configuration
        // =========================

        const firebaseConfig = {
            apiKey: "AIzaSyAR3uyMlvGNwZaG_w1zs6IKQ2lXB_Y_9M0",
            authDomain: "al-awn-blood-fighters.firebaseapp.com",
            projectId: "al-awn-blood-fighters",
            storageBucket: "al-awn-blood-fighters.firebasestorage.app",
            messagingSenderId: "299061496611",
            appId: "1:299061496611:web:4762f74dbf311cd57f1a96",
            measurementId: "G-D31EXKJWQ3"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        // =========================
        // Password Show / Hide
        // =========================

        window.togglePassword = function () {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".eye");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";

            } else {

                password.type = "password";
                button.textContent = "👁";

            }
        };


        // =========================
        // Login
        // =========================

        document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;


            const phonePattern =
                /^01[3-9]\d{8}$/;


            if (!phonePattern.test(phone)) {

                alert(
                    "সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।"
                );

                return;
            }


            if (password.length < 6) {

                alert(
                    "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
                );

                return;
            }


            const loginButton =
                document.getElementById("loginButton");


            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                // আমাদের Sign Up-এর সময়
                // phone + @aabf-user.app ব্যবহার করা হয়েছে

                const internalEmail =
                    phone + "@aabf-user.app";


                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        internalEmail,
                        password
                    );


                const user =
                    userCredential.user;


                console.log(
                    "Login successful:",
                    user.uid
                );


                alert("✅ Login সফল হয়েছে!");

const uid = user.uid;

window.location.href =
    "aabf://login-success?uid=" +
    encodeURIComponent(uid);
             
                );


                /*
                 * পরের ধাপে এখানে:
                 *
                 * Firebase Database থেকে
                 * _users / UID
                 *
                 * অথবা users / UID
                 *
                 * থেকে AABF ID ও Profile
                 * নিয়ে Home/Profile page-এ পাঠাব।
                 */


                loginButton.disabled = false;
                loginButton.textContent = "Login";


            } catch (error) {

                console.error(error);


                let message =
                    "Login করা যায়নি।";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message =
                        "মোবাইল নম্বর অথবা Password ভুল।";

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    message =
                        "এই নম্বর দিয়ে কোনো Account পাওয়া যায়নি।";

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    message =
                        "Password ভুল।";

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    message =
                        "Internet connection পরীক্ষা করুন।";

                }


                alert(message);


                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });


        // =========================
        // Go to Sign Up
        // =========================

        window.goToRegister = function () {

            window.location.href = "index.html";

        };

    </script>

</body>
</html>
